<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign-in — command center design reference</title>
<style>
  /* Self-hosted brand faces, shared with the app (src/server/public/fonts).
     Opened outside the repo these fall back to the stacks below. */
  @font-face { font-family:'Inter Variable'; font-style:normal; font-weight:100 900;
    src:url(../src/server/public/fonts/inter-latin-wght-normal.woff2) format('woff2-variations'); }
  @font-face { font-family:'Fraunces Variable'; font-style:normal; font-weight:100 900;
    src:url(../src/server/public/fonts/fraunces-latin-full-normal.woff2) format('woff2-variations'); }
</style>
<style>body{margin:0;background:#d9e2ec;font-family:'Inter Variable',Inter,system-ui,-apple-system,sans-serif;display:flex;justify-content:center;padding:40px 20px}</style>
</head>
<body>
<div class="dv-card" style="width:620px;background:#ffffff;color:#102a43;font-family:'Inter Variable',Inter,system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:70px 24px">
    <div style="background:#ffffff;border:1px solid #d9e2ec;border-radius:12px;padding:40px 36px;width:100%;max-width:400px;text-align:center">
      <div style="width:40px;height:40px;border-radius:10px;background:#117c75;color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px">QB</div>
      <h1 style="margin:0 0 6px;font-family:'Fraunces Variable',Fraunces,Georgia,'Times New Roman',serif;font-variation-settings:'opsz' 72,'SOFT' 0,'WONK' 0;font-size:20px;font-weight:700;letter-spacing:-.02em">Multi-Connect</h1>
      <p style="margin:0 0 24px;color:#486581;font-size:13.5px">Sign in with your API key to manage QuickBooks connections</p>
      <input type="password" placeholder="Paste your API key" style="width:100%;box-sizing:border-box;padding:10px 13px;border:1px solid #9fb3c8;border-radius:8px;background:#f0f4f8;color:#102a43;font-size:13.5px;margin-bottom:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></input>
      <button style="width:100%;border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;background:#117c75;color:#fff;font-family:inherit">Sign in</button>
      <p style="margin:20px 0 0;font-size:11.5px;color:#486581;line-height:1.7">Admins: use the master key from <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f0f4f8;padding:1px 5px;border-radius:4px">.env</code>. Team members: use the personal key your admin gave you.</p>
    </div>
  </div>
</body>
</html>
